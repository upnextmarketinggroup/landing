<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e6">
  <meta name="description" content="Brandem — Brand Better. Be the one they remember.">
  <title>Brandem — Brand Better.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antic&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=landing-layout-2">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <section class="intro" id="intro" aria-label="Brand introduction" aria-hidden="true">
    <div class="intro-logo" aria-hidden="true">
      <object id="intro-logo-base" data="assets/intro-logo-base.svg" type="image/svg+xml" tabindex="-1"></object>
      <object id="intro-logo-color" data="assets/intro-logo.svg" type="image/svg+xml" tabindex="-1"></object>
    </div>
    <button id="skip" class="quiet-button">Skip intro <span aria-hidden="true">↗</span></button>
  </section>
  <main id="landing">
    <div class="page-content">
      <section class="identity" aria-label="Brandem">
        <img class="hero-logo" src="assets/brandem-wordmark.svg" alt="Brandem">
        <div class="eyebrow location"><span class="status-dot"></span> CREATIVE MARKETING STUDIO</div>
        <!-- Saved for the upcoming video. See README.md to restore this block. -->
        <div class="video-placeholder" id="headline" tabindex="-1" role="img" aria-label="Video placeholder" hidden>
          <span class="play-icon" aria-hidden="true">▶</span>
          <span class="video-label">VIDEO PLACEHOLDER</span>
        </div>
      </section>
      <nav id="links" aria-label="Our links"></nav>
      <div class="closing"><span>BRAND BETTER.</span><button id="replay" hidden>Replay intro <span aria-hidden="true">↺</span></button></div>
    </div>
    <footer><span>© <span id="year">2026</span> BRANDEM</span><span>BE THE ONE THEY REMEMBER.</span></footer>
  </main>
  <noscript><p class="noscript">Our links are coming soon. Enable JavaScript to see the intro experience.</p></noscript>
</body>
</html>
